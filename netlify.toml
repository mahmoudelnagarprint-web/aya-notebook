[build]
  command = "bun run --cwd apps/web build"
  publish = "apps/web/dist"
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client"]
  included_files = ["node_modules/@supabase/**"]

# SPA fallback for the Vite bundle.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
